<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Vorploxs - The Game Powered by Players</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }

  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* ÜST BAR */
  .topbar {
    background: #1b2836;
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    position: relative;
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 30px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: #e2231a;
    border: 2px solid white;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 22px;
  }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a {
    color: #cfd8e3; text-decoration: none; font-size: 15px; padding-bottom: 6px;
  }
  .nav-links a.active { color: white; border-bottom: 2px solid #4aa3ff; }

  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .login-row { display: flex; gap: 8px; }
  .login-row input {
    height: 30px; border-radius: 3px; border: none; padding: 0 8px; font-size: 13px; width: 130px;
  }
  .login-row button {
    background: #12b562; color: white; border: none; border-radius: 3px;
    padding: 0 16px; font-size: 14px; cursor: pointer;
  }
  .login-row button:hover { background: #0fa057; }
  .forgot { font-size: 11px; color: #b7c2ce; text-decoration: none; }

  /* HERO */
  .hero {
    position: relative;
    flex: 1;
    min-height: 0;
    background: linear-gradient(180deg,#7ec8f0 0%,#bfe6f7 55%,#d8f0e0 100%);
    display: flex;
    align-items: center;
    padding: 3vh 40px;
    overflow: hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(120deg, rgba(150,80,60,0.15) 0 40px, transparent 40px 80px);
    opacity:.5;
  }

  .brand-block { position: relative; z-index: 2; max-width: 620px; }
  .brand-title {
    font-size: clamp(48px, 9vh, 110px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    -webkit-text-stroke: 3px #e2231a;
    paint-order: stroke fill;
    text-shadow: 6px 6px 0 #a3160f;
    font-family: 'Arial Black', Arial, sans-serif;
    line-height: 0.9;
  }
  .brand-sub {
    display: inline-block;
    margin-top: 18px;
    background: rgba(20,25,35,0.72);
    color: #fff;
    font-size: clamp(14px, 2.2vh, 28px);
    padding: 10px 20px;
  }

  /* SIGN UP CARD */
  .signup-card {
    position: relative;
    z-index: 3;
    margin-left: auto;
    background: rgba(235,248,255,0.95);
    border-radius: 4px;
    padding: clamp(14px, 2.2vh, 26px);
    width: min(380px, 32vw);
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .signup-card h2 { color: #223; font-size: clamp(15px, 2vh, 20px); margin-bottom: clamp(8px, 1.6vh, 16px); font-weight: 600; }
  .signup-card input {
    width: 100%; height: clamp(30px, 5vh, 40px); margin-bottom: clamp(6px, 1.4vh, 12px); border: 1px solid #b9c3cc;
    border-radius: 3px; padding: 0 12px; font-size: 13px; color: #333;
  }
  .row2 { display: flex; gap: 10px; margin-bottom: clamp(6px, 1.4vh, 12px); }
  .row2 label { font-size: 14px; color: #333; align-self: center; white-space: nowrap; }
  .row2 select {
    flex: 1; height: 40px; border: 1px solid #b9c3cc; border-radius: 3px; padding: 0 8px;
  }
  .gender-row { display: flex; align-items: center; gap: 14px; margin-bottom: clamp(8px, 1.8vh, 18px); border:1px solid #b9c3cc; border-radius:3px; padding: clamp(4px,1vh,8px) 12px;}
  .gender-row label { font-size: 14px; color: #333; }
  .gender-icon {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid #99a3ad;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size:16px; color:#99a3ad;
  }
  .gender-icon.selected { border-color: #4aa3ff; color: #4aa3ff; }
  .signup-btn {
    width: 100%; height: clamp(34px, 5.5vh, 46px); background: #12b562; color: white; border: none;
    border-radius: 3px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .signup-btn:hover { background: #0fa057; }

  .footer-credit {
    position: absolute; bottom: 20px; left: 40px; color: rgba(255,255,255,0.9);
    font-size: 18px; z-index: 2; text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
  }

  /* HOŞGELDİN EKRANI (yandan kayan animasyon) */
  .welcome-screen {
    position: fixed; inset: 0; display: none;
    z-index: 1000;
    background: linear-gradient(135deg,#0f2b4d 0%,#1c4270 50%,#2c5c92 100%);
    overflow: hidden;
    align-items: center; justify-content: center;
  }
  .welcome-slide {
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    transform: translateX(-120%);
    opacity: 0;
    animation: slideIn 0.8s ease-out forwards;
  }
  @keyframes slideIn {
    to { transform: translateX(0); opacity: 1; }
  }
  .welcome-text {
    color: #fff;
    font-size: clamp(28px, 5vh, 56px);
    font-weight: 900;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.35);
    text-align: center;
    padding: 0 20px;
  }
  .next-btn {
    background: #12b562; color: #fff; border: none;
    padding: 14px 36px; font-size: 18px; font-weight: bold;
    border-radius: 4px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    transition: transform .15s ease, background .15s ease;
  }
  .next-btn:hover { background: #0fa057; transform: translateY(-2px); }

  /* DASHBOARD EKRANI */
  .dashboard-screen {
    position: fixed; inset: 0; display: none;
    z-index: 999;
    background: linear-gradient(180deg,#1a3a63 0%, #2c5c92 55%, #1c4270 100%);
    overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .dash-city-bg {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .city-svg {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 65%;
  }

  .dash-sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 210px;
    background: rgba(10,25,45,0.55);
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 16px; z-index: 2;
  }
  .dash-avatar { margin-bottom: 14px; }
  .avatar-box {
    width: 90px; height: 90px; background: #fff; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 46px;
    overflow: hidden;
  }
  .avatar-box img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .dash-username {
    color: #fff; font-size: 18px; font-weight: 600; text-align: center;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 20px;
  }
  .dash-logout {
    margin-top: auto; color: #dce6f0; font-size: 14px;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
  }

  .dash-content {
    position: absolute; top: 0; right: 0; bottom: 0; left: 210px;
    z-index: 2; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 260px));
    grid-template-rows: repeat(2, minmax(150px, 220px));
    gap: 4px;
  }
  .dash-tile {
    background: radial-gradient(circle at 50% 35%, #3a3a3a 0%, #161616 75%);
    border-bottom: 6px solid #14355c;
    border-radius: 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    transition: transform .15s ease;
    overflow: hidden;
  }
  .dash-tile:hover { transform: translateY(-4px); }
  .dash-icon {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .dash-icon img {
    max-width: 65%; max-height: 65%; object-fit: contain; display: block;
  }
  .dash-label {
    color: #fff; font-size: 20px; font-weight: bold;
    align-self: stretch; text-align: left; padding: 8px 18px 0 18px;
  }
</style>
</head>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-icon">V</div>
    <div class="nav-links">
      <a href="#">Play</a>
      <a href="#" class="active">About</a>
      <a href="#">Platforms</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="login-row">
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="handleLogin()">Log In</button>
    </div>
    <a class="forgot" href="#" onclick="handleForgot(); return false;">Forgot Username/Password?</a>
  </div>
</div>

<div class="hero">

    <div class="brand-title">Vorploxs</div>
    <div class="brand-sub">The Game Powered by Players.</div>
  </div>

  <div class="signup-card">
    <h2>Sign up and start having fun!</h2>
    <input type="text" id="username" placeholder="Username (6-20 characters, no spaces)">
    <input type="password" id="password" placeholder="Password (4 letters and 2 numbers minimum)">
    <input type="password" id="confirm" placeholder="Confirm Password">

    <div class="row2">
      <label>Birthday:</label>
      <select><option>Month</option></select>
      <select><option>Day</option></select>
      <select><option>Year</option></select>
    </div>

    <div class="gender-row">
      <label>Gender:</label>
      <div class="gender-icon" onclick="selectGender(this)">♂</div>
      <div class="gender-icon" onclick="selectGender(this)">♀</div>
    </div>

    <button class="signup-btn" onclick="handleSignUp()">Sign Up</button>
  </div>

  <div class="footer-credit">
    VORPLOXS Point<br>
    Builder: Vorploxs
  </div>
</div>

<div class="welcome-screen" id="welcomeScreen">

    <div class="dash-logout" onclick="location.reload();">
      <span>Logout</span> ⎋
    </div>
  </div>

  <div class="dash-content"></div>
</div>

<script>
  function selectGender(el) {
    document.querySelectorAll('.gender-icon').forEach(g => g.classList.remove('selected'));
    el.classList.add('selected');
  }

  /* ---- KAYIT SİSTEMİ (localStorage, engellenirse hafızaya düşer) ---- */
  let memoryUsers = {};
  let storageWorks = true;
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
  } catch (e) {
    storageWorks = false;
  }

  function getUsers() {
    if (!storageWorks) return memoryUsers;
    try {
      return JSON.parse(localStorage.getItem('vorploxs_users') || '{}');
    } catch (e) {
      return memoryUsers;
    }
  }

  function saveUsers(users) {
    if (!storageWorks) { memoryUsers = users; return; }
    try {
      localStorage.setItem('vorploxs_users', JSON.stringify(users));
    } catch (e) {
      storageWorks = false;
      memoryUsers = users;
    }
  }

  function showWelcome(username) {
    const dashUsernameEl = document.getElementById('dashUsername');
    if (dashUsernameEl) dashUsernameEl.textContent = username || "Player";

    const welcome = document.getElementById('welcomeScreen');
    welcome.style.display = "flex";

    const slide = document.getElementById('welcomeSlide');
    slide.style.animation = 'none';
    void slide.offsetWidth;
    slide.style.animation = 'slideIn 0.8s ease-out forwards';
  }

  function handleSignUp() {
    try {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!username || username.length < 6 || username.length > 20 || username.includes(' ')) {
        alert("Kullanıcı adı 6-20 karakter olmalı ve boşluk içermemeli!");
        return;
      }

      const passOk = /^(?=.*[A-Za-z])(?=.*\d)/.test(password) && password.length >= 6;
      if (!passOk) {
        alert("Şifre en az 4 harf ve 2 rakam içermeli (toplam en az 6 karakter)!");
        return;
      }

      if (password !== confirm) {
        alert("Şifreler eşleşmiyor!");
        return;
      }

      const users = getUsers();
      if (users[username]) {
        alert("Bu kullanıcı adı zaten alınmış. Lütfen başka bir tane seçin.");
        return;
      }

      users[username] = { password: password };
      saveUsers(users);

      showWelcome(username);
    } catch (err) {
      alert("Bir hata oluştu: " + err.message);
    }
  }

  function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) {
      alert("Kullanıcı adı ve şifre girin!");
      return;
    }

    const users = getUsers();
    if (!users[username] || users[username].password !== password) {
      alert("Kullanıcı adı veya şifre hatalı!");
      return;
    }

    showWelcome(username);
  }

  function handleForgot() {
    alert("Şifre sıfırlama şu an desteklenmiyor. Lütfen yeni bir hesap oluşturun.");
  }

  function goToDashboard() {
    document.getElementById('welcomeScreen').style.display = "none";
    document.getElementById('randomScreen').style.display = "block";
  }


</script>
