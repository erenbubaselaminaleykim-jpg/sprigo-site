<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, orientation=landscape">
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sprigo — Play Together, Build Forever</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }

  html, body { 
    height: 100vh; 
    overflow: hidden; 
    width: 100vw;
    background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%);
  }
  
  body { 
    display: flex; 
    flex-direction: row;
    margin: 0;
    padding: 0;
    max-width: 100%;
  }

  .container {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 30px 40px;
    gap: 30px;
  }

  /* LEFT SIDE - Info Text */
  .info-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .sprigo-logo {
    width: 50px;
    height: 50px;
    background: #ff6b4a;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 900;
    color: white;
    margin-bottom: 20px;
  }

  .info-text {
    color: white;
    font-size: 15px;
    line-height: 1.6;
    max-width: 350px;
    font-weight: 500;
  }

  .info-text strong {
    display: block;
    font-size: 18px;
    margin-bottom: 12px;
    color: #FFD700;
  }

  /* RIGHT SIDE - Signup Card */
  .card-section {
    flex: 0.7;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .signup-card {
    background: rgba(139, 92, 246, 0.9);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 300px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    max-height: 85vh;
    overflow-y: auto;
  }

  .signup-card h2 {
    color: white;
    text-align: center;
    margin-bottom: 18px;
    font-size: 20px;
  }

  .signup-card input, .signup-card select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 6px;
    font-size: 13px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
  }

  .signup-card input::placeholder, .signup-card select {
    color: rgba(255, 255, 255, 0.7);
  }

  .signup-card input:focus, .signup-card select:focus {
    outline: none;
    border-color: #ff6b4a;
    background: rgba(255, 255, 255, 0.15);
  }

  .form-row {
    display: flex;
    gap: 8px;
  }

  .form-row select {
    flex: 1;
  }

  .form-group {
    display: flex;
    gap: 12px;
    margin: 10px 0;
  }

  .form-group label {
    color: white;
    display: flex;
    align-items: center;
    cursor: pointer;
    font-size: 13px;
  }

  .form-group input[type="radio"] {
    width: 16px;
    height: 16px;
    margin: 0;
    cursor: pointer;
  }

  .signup-card button {
    width: 100%;
    padding: 10px;
    background: #ff6b4a;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }

  .signup-card button:hover {
    background: #ff5a34;
  }

  .login-link {
    text-align: center;
    margin-top: 12px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
  }

  .login-link a {
    color: #FFD700;
    text-decoration: none;
    cursor: pointer;
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }

  /* MOBILE/TABLET */
  @media (max-width: 1100px) {
    .container {
      flex-direction: column;
      padding: 20px;
      justify-content: center;
      gap: 20px;
    }

    .info-section {
      display: none;
    }

    .card-section {
      width: 100%;
      flex: 1;
    }

    .signup-card {
      max-width: 100%;
    }
  }

  @media (max-width: 768px) {
    .container {
      padding: 15px;
    }

    .signup-card {
      padding: 16px;
      max-width: 100%;
    }

    .info-text {
      font-size: 14px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- LEFT: Info Section -->
  <div class="info-section" id="infoSection">
    <div class="sprigo-logo">S</div>
    <div class="info-text">
      <strong>⚠️ Önemli!</strong>
      Evet bu oyuna Rastladıysan Roblox ile alakamız yoktur Tamamen kendimize özgün bir Oyunumuzu yapıyoruz!!
    </div>
  </div>

  <!-- RIGHT: Signup Card -->
  <div class="card-section">
    <div class="signup-card">
      <!-- LOGIN SCREEN -->
      <div class="screen active" id="loginScreen">
        <h2>Giriş Yap</h2>
        <input type="text" placeholder="Kullanıcı Adı" id="loginUsername">
        <input type="password" placeholder="Şifre" id="loginPassword">
        <button onclick="handleLogin()">Giriş</button>
        <div class="login-link">
          Hesabın yok mu? <a onclick="switchToSignup()">Kayıt Ol</a>
        </div>
      </div>

      <!-- SIGNUP SCREEN -->
      <div class="screen" id="signupScreen">
        <h2>Kayıt Ol</h2>
        <input type="text" placeholder="Kullanıcı Adı" id="signupUsername">
        <input type="password" placeholder="Şifre (4 harf + 2 rakam)" id="signupPassword">
        <input type="password" placeholder="Şifreyi Onayla" id="confirmPassword">
        
        <label style="color: white; font-size: 12px; margin-top: 8px;">Doğum Tarihi:</label>
        <div class="form-row">
          <select id="month"><option>Ay</option><option>Ocak</option><option>Şubat</option><option>Mart</option><option>Nisan</option><option>Mayıs</option><option>Haziran</option><option>Temmuz</option><option>Ağustos</option><option>Eylül</option><option>Ekim</option><option>Kasım</option><option>Aralık</option></select>
          <select id="day"><option>Gün</option></select>
          <select id="year"><option>Yıl</option></select>
        </div>

        <label style="color: white; font-size: 12px; margin-top: 8px;">Cinsiyet:</label>
        <div class="form-group">
          <label><input type="radio" name="gender" value="M"> Erkek</label>
          <label><input type="radio" name="gender" value="F"> Kadın</label>
        </div>

        <button onclick="handleSignup()">Kayıt Ol</button>
        <div class="login-link">
          Zaten hesabın var mı? <a onclick="switchToLogin()">Giriş Yap</a>
        </div>
      </div>

      <!-- WELCOME SCREEN -->
      <div class="screen" id="welcomeScreen">
        <h2 style="font-size: 22px; margin-bottom: 30px;">Hoş Geldin! 🎮</h2>
        <p style="color: white; text-align: center; margin-bottom: 25px; font-size: 14px;" id="welcomeUsername"></p>
        <button onclick="logout()" style="background: #ff6b4a;">Çıkış Yap</button>
      </div>
    </div>
  </div>
</div>

<script>
  function initializeDateSelectors() {
    const daySelect = document.getElementById('day');
    for (let i = 1; i <= 31; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = i;
      daySelect.appendChild(option);
    }

    const yearSelect = document.getElementById('year');
    const currentYear = new Date().getFullYear();
    for (let i = currentYear; i >= 1990; i--) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = i;
      yearSelect.appendChild(option);
    }
  }

  function switchToSignup() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('signupScreen').classList.add('active');
  }

  function switchToLogin() {
    document.getElementById('signupScreen').classList.remove('active');
    document.getElementById('loginScreen').classList.add('active');
  }

  function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) {
      alert('Lütfen tüm alanları doldurun!');
      return;
    }

    const users = JSON.parse(localStorage.getItem('sprigo_users') || '{}');
    if (users[username] && users[username].password === password) {
      localStorage.setItem('currentUser', username);
      showWelcomeScreen(username);
    } else {
      alert('Kullanıcı adı veya şifre hatalı!');
    }
  }

  function handleSignup() {
    const username = document.getElementById('signupUsername').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!username || !password || !confirmPassword) {
      alert('Lütfen tüm alanları doldurun!');
      return;
    }

    if (username.length < 6 || username.length > 20) {
      alert('Kullanıcı adı 6-20 karakter olmalı!');
      return;
    }

    if (!/[a-zA-Z]/.test(password) || !/\d/.test(password) || password.length < 6) {
      alert('Şifre en az 4 harf ve 2 rakam içermeli!');
      return;
    }

    if (password !== confirmPassword) {
      alert('Şifreler eşleşmiyor!');
      return;
    }

    const users = JSON.parse(localStorage.getItem('sprigo_users') || '{}');
    if (users[username]) {
      alert('Bu kullanıcı adı zaten alınmış!');
      return;
    }

    users[username] = { password };
    localStorage.setItem('sprigo_users', JSON.stringify(users));
    localStorage.setItem('currentUser', username);
    showWelcomeScreen(username);
  }

  function showWelcomeScreen(username) {
    document.getElementById('signupScreen').classList.remove('active');
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('welcomeScreen').classList.add('active');
    document.getElementById('welcomeUsername').textContent = `${username} adlı kullanıcı olarak giriş yaptın!`;
  }

  function logout() {
    localStorage.removeItem('currentUser');
    document.getElementById('welcomeScreen').classList.remove('active');
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  }

  function checkLogin() {
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      showWelcomeScreen(currentUser);
    }
  }

  initializeDateSelectors();
  checkLogin();
</script>

</body>
</html>
